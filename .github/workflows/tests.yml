name: SYRAVON OSINT Cross-Platform Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q syravon_osint

      - name: Check CLI help
        run: |
          python -m syravon_osint --help

      - name: Check CLI module commands
        shell: bash
        run: |
          python -m syravon_osint domain --help
          python -m syravon_osint ip --help
          python -m syravon_osint email-domain --help
          python -m syravon_osint metadata --help

      - name: Check Flask Web import
        run: |
          python -c "from syravon_osint.web import app; print('Web import OK')"
